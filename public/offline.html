<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Cutline Studio</title>
  <style>
    body {
      background-color: #0B0C0E;
      color: #E6E8EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 440px;
      background-color: #121417;
      border: 1px solid #22262E;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #E5A93C;
      clip-path: polygon(0 0, 75% 0, 100% 25%, 100% 100%, 0 100%);
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 12px;
      color: #FFFFFF;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #9CA3AF;
      margin: 0 0 24px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-family: monospace;
      color: #E5A93C;
      background: #2D220E;
      border: 1px solid #4D3A1B;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background-color: #E5A93C;
      color: #0B0C0E;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <div class="badge">OFFLINE STATE</div>
    <h1>Connection Unavailable</h1>
    <p>You are currently offline. Cutline keeps your cached workspaces viewable, but AI script generation, background rendering, and YouTube publishing require an active network connection.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
